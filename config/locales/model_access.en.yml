en:
  model_access:
    subject: "Choose your next posing date at %{drawing_session}"
    paused: Your posing access at this session is paused. Contact an organizer; you can still cancel an existing booking.
    invitation_required: Please wait for an organizer to invite you to choose your next posing date.
    reason_required: Provide a pause explanation of 1 to 200 characters.
    forbidden: Model management access is required.
    sent: Booking enabled and invitation email sent.
    skipped: No invitation sent. This model is booked, paused, or inactive.
    email_failed: Booking enabled, but invitation email could not be sent. Contact the model directly or try again.
    pause_saved: Model paused. Any existing booking is retained.
    resumed: Model resumed. Existing booking permission is preserved; invite them again if their last drawing is completed.
    bulk_result: "Booking enabled and email sent to %{sent} models; %{failed} email deliveries failed (access remains enabled); %{skipped} booked, paused, or inactive models skipped."
