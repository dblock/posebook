en:
  booking_notifications:
    saved: Notification saved.
    unsubscribed: Booking reminders disabled.
    booking_created:
      title: Booking Created
      description: Shares new booking details with participants.
      subject: "You're booked: {program_name} - {session_date}"
      body: |
        Hi {participant_name},

        Your session is booked:
        {session_details}

        {confirmation_details}

        View your booking:
        {booking_url}

        Questions? Contact {organizer_contact}.
    booking_changed:
      title: Booking Changed
      description: Explains booking or venue changes to participants.
      subject: "Your session has changed: {program_name}"
      body: |
        Hi {participant_name},

        Your booking has changed.

        Previously:
        {previous_session_details}

        Now:
        {session_details}

        {confirmation_details}

        View your updated booking:
        {booking_url}

        Questions? Contact {organizer_contact}.
    booking_canceled:
      title: Booking Canceled
      description: Notifies participants of a cancellation.
      subject: "Booking canceled: {program_name} - {session_date}"
      body: |
        Hi {participant_name},

        Your booking has been canceled:
        {session_details}

        You are no longer expected for this booking.
        Questions? Contact {organizer_contact}.
    attendance_confirmed:
      title: Attendance Confirmed
      description: Notifies coordinators when attendance is confirmed.
      subject: "Attendance confirmed: {participant_name} - {session_date}"
      body: |
        {participant_name}'s attendance is confirmed.

        {program_name}
        {session_details}

        View booking:
        {booking_url}
    attendance_cleared:
      title: Attendance Confirmation Cleared
      description: Asks participants to reconfirm attendance after it was cleared.
      subject: "Please reconfirm your attendance: {program_name}"
      body: |
        Hi {participant_name},

        An organizer has cleared your attendance confirmation.
        Your booking is still in place:
        {session_details}

        {confirmation_details}

        View booking:
        {booking_url}
    confirmation_request:
      title: Attendance Confirmation Request
      description: Requests attendance confirmation when the window opens.
      subject: "Please confirm your session: {program_name} - {session_date}"
      body: |
        Hi {participant_name},

        Please confirm that you will attend:
        {session_details}

        Confirm attendance:
        {confirmation_url}

        Self-service rescheduling closes on {rescheduling_deadline}.
        If you need help, contact {organizer_contact}.
    confirmation_reminder:
      title: Unconfirmed Attendance Reminder
      description: Reminds participants whose attendance is still unconfirmed.
      subject: "Reminder to confirm: {program_name} - {session_date}"
      body: |
        Hi {participant_name},

        You have not confirmed attendance for:
        {session_details}

        Please confirm now:
        {confirmation_url}

        If you cannot attend, contact {organizer_contact}.
    session_reminder:
      title: Upcoming Session Reminder
      description: Reminds participants of their upcoming session.
      subject: "Your upcoming session: {program_name} - {session_date}"
      body: |
        Hi {participant_name},

        A reminder about your upcoming session:
        {session_details}

        {attendance_status}
        {confirmation_details}

        View booking:
        {booking_url}

        Questions? Contact {organizer_contact}.
    coordinator_alert:
      title: Coordinator Unconfirmed Attendance Alert
      description: Alerts coordinators to follow up on unconfirmed attendance.
      subject: "Attendance not confirmed: {participant_name} - {session_date}"
      body: |
        {participant_name} has not confirmed attendance.

        {program_name}
        {session_details}

        Please follow up directly.
        View booking:
        {booking_url}
    coordinator_booking_created:
      title: Coordinator New Booking
      description: Tells coordinators that a participant booked a session.
      subject: "New booking: {participant_name} - {session_date}"
      body: |
        {participant_name} booked a session at {program_name}:
        {session_details}

        View booking:
        {booking_url}
    coordinator_booking_changed:
      title: Coordinator Booking Changed
      description: Tells coordinators about booking or venue changes.
      subject: "Booking changed: {participant_name} - {session_date}"
      body: |
        A booking at {program_name} has changed.

        Participant: {participant_name}

        Previously:
        {previous_session_details}

        Now:
        {session_details}

        View booking:
        {booking_url}
    coordinator_booking_canceled:
      title: Coordinator Booking Canceled
      description: Tells coordinators that a booking was canceled.
      subject: "Booking canceled: {participant_name} - {session_date}"
      body: |
        {participant_name}'s booking at {program_name} has been canceled:
        {session_details}

        View calendar:
        {booking_url}
    coordinator_attendance_cleared:
      title: Coordinator Attendance Confirmation Cleared
      description: Tells coordinators that a participant must reconfirm attendance.
      subject: "Attendance confirmation cleared: {participant_name} - {session_date}"
      body: |
        {participant_name}'s attendance confirmation was cleared. The booking is still in place:

        {program_name}
        {session_details}

        View booking:
        {booking_url}
    password_reset:
      title: Password Reset
      description: Sends a requested password reset link.
      subject: Reset your Posebook password
      body: |
        Use this link to reset your Posebook password:

        {reset_url}

        This link expires in 30 minutes and can be used once. If you did not request it, you can ignore this email.
    email_change:
      title: Email Change Verification
      description: Verifies a requested account email change.
      subject: Confirm your Posebook email address
      body: |
        Confirm this email address for your Posebook account:

        {confirmation_url}

        This link expires in 30 minutes. Your current email address remains unchanged until you confirm.
    application_registration:
      title: Application Email Verification
      description: Verifies an applicant's email before preparing an application.
      subject: "Verify Your Email to Apply to {program_name}"
      body: |
        Verify your email to prepare an application to {program_name}:

        {verification_url}

        This link expires in 30 minutes and can be used once. Opening it does not create an account or grant participation. You must sign in or create your account and explicitly continue.

        Preparing an account does not submit an application or grant booking access. Coordinators must accept your application separately.

        If you did not request this email, you can ignore it.
    participant_invitation:
      title: Participant Invitation
      description: Invites someone to join a program.
      subject: "You are invited as {participant_article} {participant_label} at {program_name}"
      body: |
        You are invited to participate at {program_name}.

        Regular schedule: {regular_schedule}.

        Create an account or sign in using {recipient_email}, then accept your invitation:
        {invitation_url}

        This personal link is restricted to your invited email address, can be accepted once, and expires in 30 days. Do not share it publicly.
    program_coordinator_invitation:
      title: Program Coordinator Invitation
      description: Invites someone to manage a program.
      subject: "Invitation to manage {target_name} as a {coordinator_label}"
      body: |
        You are invited to manage {target_name} as a {coordinator_label}.

        Create an account or sign in using {recipient_email}, then accept your invitation:
        {invitation_url}

        This personal link is restricted to your invited email address, can be accepted once, and expires in 30 days. Do not share it publicly.
    venue_coordinator_invitation:
      title: Venue Coordinator Invitation
      description: Invites someone to manage a venue.
      subject: "Invitation to manage {target_name} as a {coordinator_label}"
      body: |
        You are invited to manage {target_name} as a {coordinator_label}.

        Create an account or sign in using {recipient_email}, then accept your invitation:
        {invitation_url}

        This personal link is restricted to your invited email address, can be accepted once, and expires in 30 days. Do not share it publicly.
    booking_invitation:
      title: Invitation to Book
      description: Invites a participant to choose another booking date.
      subject: "Choose your next booking date at {program_name}"
      body: |
        Hi {recipient_name},

        You are invited to choose your next booking date at {program_name}.

        Regular schedule: {regular_schedule}.

        Sign in to your existing account and choose an available future date:
        {booking_url}

        You may cancel or reschedule with an explanation. After you complete your booking, an organizer must invite you again before you can make another booking.
    application_draft:
      title: Incomplete Application Reminder
      description: Reminds an applicant to finish an unsubmitted draft.
      subject: "Finish Your Participation Application: {program_name}"
      body: |
        You have an unfinished participation application for {program_name}.

        Sign in to complete it or choose Abandon Draft:
        {application_url}

        Your draft is private and has not been submitted to the coordinators. Opening this link does not submit or abandon it.

        We send one completion reminder after {reminder_days} days. Unfinished drafts are automatically removed after 30 days from the first save, even if you edit them later. Your account, account photos, and submitted application history are not deleted.
    application_submitted:
      title: Application Submitted
      description: Alerts coordinators to a new application.
      subject: "New Participation Application for {program_name}"
      body: |
        A new participation application is ready for {program_name}.

        Applicant: {participant_name}

        Sign in to review the application, message, and consented profile/photos:
        {review_url}

        Use the authenticated review page to choose Accept or Reject. Opening this email or link does not make a decision.
    application_accepted:
      title: Application Accepted
      description: Tells an applicant their application was accepted.
      subject: "Application Accepted: {program_name}"
      body: |
        Thank you for your interest in {program_name}.

        Your application has been accepted. You now have participant access through the same admission process as an accepted personal invitation.

        Choose an available date in the calendar:
        {calendar_url}

        Existing program availability, booking rules, invitation cycles, and any pause still apply.

        View your current application and retained decision history:
        {application_url}

        Sign in with the account you used to apply. The application page always shows the current status.
    application_declined:
      title: Application Rejected
      description: Tells an applicant their application was not accepted.
      subject: "An Update About Your Application: {program_name}"
      body: |
        Thank you for your interest in {program_name}.

        We are not accepting your application right now. Your application remains on file for future consideration, and coordinators can accept it later without a new submission.

        You can withdraw your application to end application-only profile review and future acceptance.

        View your current application and retained decision history:
        {application_url}

        Sign in with the account you used to apply. The application page always shows the current status.
    participation_admission:
      title: Participation Accepted
      description: Notifies coordinators when someone joins a program.
      subject: "Participation Accepted: {program_name}"
      body: |
        {admission_source} for {program_name} was accepted.

        {participant_label}: {participant_name}

        Sign in to review the participation history:
        {history_url}

        Existing booking rules, invitations, and pauses remain in effect. Accepting another invitation or application does not renew an existing participant's booking access.
