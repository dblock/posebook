development:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI', 'mongodb://127.0.0.1:27017/posebook_development').to_json %>
      options:
        server_selection_timeout: 5

test:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_TEST_URI', 'mongodb://127.0.0.1:27017/posebook_test').to_json %>
      options:
        server_selection_timeout: 5

production:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI') { Rails.env.production? ? raise('MONGODB_URI is required in production') : 'mongodb://127.0.0.1:27017/posebook_unused' }.to_json %>
      options:
        server_selection_timeout: 5
