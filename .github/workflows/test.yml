name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    name: Test Ruby ${{ matrix.entry.ruby }} Against MongoDB ${{ matrix.entry.mongodb }} (${{ matrix.entry.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '4.0.9', mongodb: '8.0', shard: 1 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 2 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 3 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 4 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 5 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 6 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 7 }
          - { ruby: '4.0.9', mongodb: '8.0', shard: 8 }
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Set Up Database and Image Processing
        run: |
          docker run --detach --name posebook-mongodb --publish 27017:27017 mongo:${{ matrix.entry.mongodb }} --replSet rs0 --bind_ip_all &
          database_pid=$!
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips42t64
          wait "$database_pid"
          for attempt in {1..30}; do
            if docker exec posebook-mongodb mongosh --quiet --eval 'db.adminCommand({ping: 1})'; then break; fi
            sleep 1
          done
          docker exec posebook-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          docker exec posebook-mongodb mongosh --quiet --eval 'const deadline=Date.now()+30000; while(!db.hello().isWritablePrimary && Date.now()<deadline) sleep(100); if(!db.hello().isWritablePrimary) throw new Error("Replica set not writable")'
      - name: Run Tests
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/posebook_test?replicaSet=rs0
          SHARD_NUMBER: ${{ matrix.entry.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          bundle exec ruby script/test_shard.rb "$((SHARD_NUMBER - 1))" "$SHARD_COUNT" "$GITHUB_RUN_ID"
          cp coverage/.resultset.json "coverage/shard-${SHARD_NUMBER}.json"
      - name: Upload Shard Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage-${{ matrix.entry.shard }}
          path: coverage/shard-${{ matrix.entry.shard }}.json
          if-no-files-found: error
          overwrite: true

  test:
    name: Test Ruby 4.0.9 Against MongoDB 8.0
    runs-on: ubuntu-latest
    needs: shard
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify All Test Shards Passed
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: test "$SHARD_RESULT" = success
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: Download Shard Coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          pattern: test-coverage-*
          path: tmp/test-coverage
          merge-multiple: true
      - name: Combine Coverage Reports
        env:
          SHARD_COUNT: 8
        run: |
          reports=()
          for shard in $(seq 1 "$SHARD_COUNT"); do
            test -s "tmp/test-coverage/shard-${shard}.json"
            reports+=("tmp/test-coverage/shard-${shard}.json")
          done
          bundle exec ruby -rsimplecov -e 'SimpleCov.collate(ARGV)' "${reports[@]}"
          test -s coverage/lcov.info
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
