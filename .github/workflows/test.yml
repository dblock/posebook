name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    name: Test
    uses: dblock/parallel_tests-ci/.github/workflows/rspec.yml@33c153f6b5831cdeb26b45e02ac995edb72f6ab6 # v0.2.1
    permissions:
      actions: read
      contents: read
    with:
      ruby-version: '4.0.10'
      shards: 8
      artifact-prefix: posebook
      environment: '{"MONGODB_TEST_URI":"mongodb://127.0.0.1:27017/posebook_test?replicaSet=rs0"}'
      artifacts: coverage/.resultset.json
      setup: |
        docker run --detach --name posebook-mongodb --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all &
        database_pid=$!
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y libvips42t64
        wait "$database_pid"
        for attempt in {1..30}; do
          if docker exec posebook-mongodb mongosh --quiet --eval 'db.adminCommand({ping: 1})'; then break; fi
          sleep 1
        done
        docker exec posebook-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
        docker exec posebook-mongodb mongosh --quiet --eval 'const deadline=Date.now()+30000; while(!db.hello().isWritablePrimary && Date.now()<deadline) sleep(100); if(!db.hello().isWritablePrimary) throw new Error("Replica set not writable")'

  test:
    name: Test Ruby 4.0.10 Against MongoDB 8.0
    runs-on: ubuntu-latest
    needs: shard
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify All Test Shards Passed
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: test "$SHARD_RESULT" = success
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - name: Download Shard Coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          pattern: posebook-test-*
          path: tmp/test-coverage
      - name: Combine Coverage Reports
        env:
          SHARD_COUNT: 8
        run: |
          reports=()
          for shard in $(seq 1 "$SHARD_COUNT"); do
            report=$(printf '%s\n' tmp/test-coverage/posebook-test-"$shard"-*/.resultset.json | sort -V | tail -n 1)
            test -s "$report"
            reports+=("$report")
          done
          bundle exec ruby -rsimplecov -e 'SimpleCov.collate(ARGV)' "${reports[@]}"
          test -s coverage/lcov.info
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
