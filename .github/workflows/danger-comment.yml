name: Danger Comment

on:
  workflow_run:
    workflows: [Danger]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Post Review Comment
    uses: dblock/danger-pr-comment/.github/workflows/danger-comment.yml@05165a1dec5a5a0de2a1b0717e1ab030302a593e # danger/danger-pr-comment#28
    with:
      comment-empty: false
      delete-empty: true
      base-branch: '*'
